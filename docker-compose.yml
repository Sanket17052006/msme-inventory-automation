services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: msme
      POSTGRES_USER: msme
      POSTGRES_PASSWORD: msme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msme"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://msme:msme@db:5432/msme
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend

  stock-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python stock_monitor.py
    environment:
      DATABASE_URL: postgresql+asyncpg://msme:msme@db:5432/msme
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python telegram_bot.py
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://msme:msme@db:5432/msme
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

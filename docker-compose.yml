services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: msme
      POSTGRES_USER: msme
      POSTGRES_PASSWORD: msme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://msme:msme@db:5432/msme
    depends_on:
      - db

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
